[package]
name = "rust-examples-patriots"
version = "0.1.0"
edition = "2021"
description = "rust programming concepts through the 2004 new england patriots"
authors = ["Bryan Chasko"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
regex = "1"
rayon = "1"
anyhow = "1"

[[example]]
name = "functions"
path = "src/functions/brady_calculator.rs"

[[example]]
name = "structs_traits"
path = "src/structs_traits/player.rs"

[[example]]
name = "error_handling"
path = "src/error_handling/game_result.rs"

[[example]]
name = "iterators"
path = "src/loops_iterators/roster_iter.rs"

[[example]]
name = "enums"
path = "src/enums/play_type.rs"

[[example]]
name = "control_flow"
path = "src/control_flow/game_state.rs"

[[example]]
name = "file_io"
path = "examples/file_io.rs"

[[example]]
name = "closures"
path = "examples/closures.rs"

[[example]]
name = "lifetimes"
path = "examples/lifetimes.rs"

[[example]]
name = "generics"
path = "examples/generics.rs"

[[example]]
name = "regex"
path = "examples/regex.rs"

[[example]]
name = "concurrency"
path = "examples/concurrency.rs"

[dev-dependencies]
assert_matches = "1"
